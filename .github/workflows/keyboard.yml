name: Build Keyboard IPA

on:
  push:
    paths:
      - "keyboard/**"
      - ".github/workflows/keyboard.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: keyboard
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project NumberKeys.xcodeproj \
            -scheme NumberKeys \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/NumberKeys.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build.log | grep -E "error:|warning: unre|ARCHIVE" || true
          test -d build/NumberKeys.xcarchive/Products/Applications/NumberKeys.app

      - name: Show errors
        if: failure()
        run: grep -n "error:" build.log | head -50 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/NumberKeys.xcarchive/Products/Applications/NumberKeys.app Payload/
          ls Payload/NumberKeys.app/PlugIns
          zip -r -y NumberKeys.ipa Payload
          ls -lh NumberKeys.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NumberKeys-ipa
          path: keyboard/NumberKeys.ipa
