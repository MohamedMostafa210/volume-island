name: NumberKeys
options:
  bundleIdPrefix: com.momo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NumberKeys:
    type: application
    platform: iOS
    sources:
      - NumberKeys
    info:
      path: Generated/NumberKeys-Info.plist
      properties:
        CFBundleDisplayName: NumberKeys
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.momo.numberkeys
    dependencies:
      - target: KeyboardEnglish
      - target: KeyboardArabic

  KeyboardEnglish:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
    info:
      path: Generated/KeyboardEnglish-Info.plist
      properties:
        CFBundleDisplayName: NumberKeys English
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_NAME: KeyboardEnglish
        PRODUCT_BUNDLE_IDENTIFIER: com.momo.numberkeys.english
        APPLICATION_EXTENSION_API_ONLY: YES

  KeyboardArabic:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
    info:
      path: Generated/KeyboardArabic-Info.plist
      properties:
        CFBundleDisplayName: NumberKeys Arabic
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: true
            PrimaryLanguage: ar
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_NAME: KeyboardArabic
        PRODUCT_BUNDLE_IDENTIFIER: com.momo.numberkeys.arabic
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ARABIC_KEYBOARD"
